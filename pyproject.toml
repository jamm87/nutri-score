[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriscore-cli"
version = "0.1.0"
description = "Calcula el Nutri-Score (algoritmo 2023) a partir de fotos de la etiqueta, con coste mínimo"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "zxing-cpp>=2.2",
    "google-genai>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nutriscore = "nutriscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
